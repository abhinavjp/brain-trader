[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-trader"
version = "0.1.0"
description = "Multi-agent LLM framework for financial market analysis and trading decisions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brain Trader Contributors" }]

dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "yfinance>=0.2",
    "stockstats>=0.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
alpha-vantage = ["alpha-vantage>=2.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
brain-trader = "brain_trader.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["brain_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
